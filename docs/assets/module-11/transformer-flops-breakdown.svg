<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <title id="title">Approximate Transformer layer FLOPs</title>
  <desc id="desc">A bar chart comparing QKV, attention, output projection, and gated MLP FLOPs for a 128-token Qwen2.5-0.5B layer.</desc>
  <rect width="1000" height="460" rx="24" fill="#111827"/>
  <text x="500" y="42" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="25" font-weight="700">Approximate FLOPs per Transformer layer</text>
  <text x="500" y="68" text-anchor="middle" fill="#cbd5e1" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">Batch 1 · 128 prompt tokens · matmul estimates only</text>
  <g stroke="#475569" stroke-width="1"><path d="M150 360 H900"/><path d="M150 300 H900"/><path d="M150 240 H900"/><path d="M150 180 H900"/><path d="M150 120 H900"/></g>
  <g fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" text-anchor="end"><text x="140" y="364">0</text><text x="140" y="304">1</text><text x="140" y="244">2</text><text x="140" y="184">3</text><text x="140" y="124">4 GFLOPs</text></g>
  <g>
    <rect x="190" y="344" width="120" height="16" rx="6" fill="#60a5fa"/>
    <rect x="370" y="356" width="120" height="4" rx="2" fill="#fb7185"/>
    <rect x="550" y="348" width="120" height="12" rx="6" fill="#fbbf24"/>
    <rect x="730" y="159" width="120" height="201" rx="8" fill="#86efac"/>
  </g>
  <g fill="#e2e8f0" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle" font-size="13"><text x="250" y="390">QKV</text><text x="430" y="390">Attention</text><text x="610" y="390">O projection</text><text x="790" y="390">Gated MLP</text></g>
  <g fill="#bfdbfe" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle" font-size="13"><text x="250" y="330">0.264</text><text x="430" y="340">0.059</text><text x="610" y="334">0.206</text><text x="790" y="145" fill="#bbf7d0">3.347</text></g>
  <text x="500" y="430" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">The MLP dominates dense projection FLOPs, but latency still depends on shape, kernels, and memory traffic.</text>
</svg>
