<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 430" role="img" aria-labelledby="title desc">
  <title id="title">Transformer layer GPU workload pipeline</title>
  <desc id="desc">A conceptual pipeline from RMSNorm through QKV projections, RoPE and attention, output projection, a second RMSNorm, and gated MLP.</desc>
  <rect width="1150" height="430" rx="24" fill="#111827"/>
  <g font-family="ui-sans-serif,system-ui,sans-serif" fill="#f8fafc">
    <text x="575" y="40" text-anchor="middle" font-size="25" font-weight="700">Inside one decoder-only Transformer layer</text>
    <text x="575" y="68" text-anchor="middle" font-size="13" fill="#cbd5e1">Each stage is a different GPU workload: reduction, GEMM, attention, elementwise work, or residual addition</text>
  </g>
  <g stroke-width="2">
    <rect x="35" y="145" width="120" height="100" rx="15" fill="#172554" stroke="#60a5fa"/>
    <rect x="180" y="145" width="155" height="100" rx="15" fill="#14532d" stroke="#86efac"/>
    <rect x="360" y="145" width="160" height="100" rx="15" fill="#3f1d35" stroke="#fb7185"/>
    <rect x="545" y="145" width="140" height="100" rx="15" fill="#451a03" stroke="#fbbf24"/>
    <rect x="710" y="145" width="120" height="100" rx="15" fill="#172554" stroke="#60a5fa"/>
    <rect x="855" y="145" width="180" height="100" rx="15" fill="#14532d" stroke="#86efac"/>
  </g>
  <g font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">
    <g font-size="15" font-weight="700">
      <text x="95" y="180" fill="#bfdbfe">RMSNorm</text>
      <text x="257" y="180" fill="#bbf7d0">QKV GEMMs</text>
      <text x="440" y="180" fill="#fecdd3">RoPE + attention</text>
      <text x="615" y="180" fill="#fde68a">O GEMM</text>
      <text x="770" y="180" fill="#bfdbfe">RMSNorm</text>
      <text x="945" y="180" fill="#bbf7d0">Gated MLP</text>
    </g>
    <g font-size="12" fill="#e2e8f0">
      <text x="95" y="210">reduction</text><text x="95" y="228">+ scale</text>
      <text x="257" y="210">Q: 896→896</text><text x="257" y="228">K/V: 896→128</text>
      <text x="440" y="210">QKᵀ · softmax · PV</text><text x="440" y="228">KV cache read</text>
      <text x="615" y="210">896→896</text><text x="615" y="228">residual add</text>
      <text x="770" y="210">reduction</text><text x="770" y="228">+ scale</text>
      <text x="945" y="210">gate/up: 896→4864</text><text x="945" y="228">down: 4864→896</text>
    </g>
  </g>
  <g fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round">
    <path d="M160 195 H175"/><path d="M340 195 H355"/><path d="M525 195 H540"/><path d="M690 195 H705"/><path d="M835 195 H850"/>
    <path d="M170 185 l10 10 -10 10"/><path d="M350 185 l10 10 -10 10"/><path d="M530 185 l10 10 -10 10"/><path d="M695 185 l10 10 -10 10"/><path d="M840 185 l10 10 -10 10"/>
  </g>
  <path d="M945 280 C945 350 120 350 95 270" fill="none" stroke="#a5b4fc" stroke-width="3" stroke-dasharray="8 7"/>
  <path d="M100 262 l-8 12 14 1" fill="none" stroke="#a5b4fc" stroke-width="3"/>
  <text x="575" y="335" text-anchor="middle" fill="#c7d2fe" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">Residual path carries the layer input around the attention and MLP branches</text>
  <text x="575" y="395" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">Prefill exposes many rows to the GEMMs; decode usually supplies one new row per active sequence</text>
</svg>
