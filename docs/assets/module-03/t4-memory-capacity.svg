<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">T4 memory capacity comparison</title><desc id="desc">The T4 has much more global VRAM than its on-chip L2 cache and SM-local storage.</desc><rect x="8" y="8" width="744" height="284" rx="14" fill="#64748b" fill-opacity=".08" stroke="#94a3b8" stroke-opacity=".45"/><g fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif"><text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700">T4 memory resources are not equally sized</text><text x="38" y="86" font-size="14">Registers / SM</text><text x="38" y="132" font-size="14">Shared memory / L1</text><text x="38" y="178" font-size="14">L2 cache</text><text x="38" y="224" font-size="14">Global VRAM</text></g><g><rect x="190" y="70" width="24" height="22" rx="4" fill="#7c3aed"/><rect x="190" y="116" width="48" height="22" rx="4" fill="#0d9488"/><rect x="190" y="162" width="90" height="22" rx="4" fill="#2563eb"/><rect x="190" y="208" width="500" height="22" rx="4" fill="#b45309"/></g><g fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13"><text x="230" y="87">65,536 32-bit registers / SM</text><text x="254" y="133">up to 64 KiB configurable shared memory</text><text x="296" y="179">4 MiB shared L2 cache</text><text x="704" y="225" text-anchor="end">16 GB GDDR6</text></g><text x="380" y="270" text-anchor="middle" fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">Not to scale — the point is the capacity gap between on-chip storage and VRAM.</text></svg>
