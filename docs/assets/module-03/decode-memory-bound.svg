<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">Why single-token decode can be memory bound</title><desc id="desc">A large weight matrix is streamed for a small amount of arithmetic in a batch-one decode step.</desc><rect x="8" y="8" width="744" height="284" rx="14" fill="#64748b" fill-opacity=".08" stroke="#94a3b8" stroke-opacity=".45"/><g fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle"><text x="380" y="38" font-size="22" font-weight="700">Batch-1 decode: move a lot, compute a little</text><text x="380" y="70" font-size="14">large weight matrix W</text><text x="380" y="238" font-size="14">one token vector X</text><text x="380" y="270" font-size="14">Y = XW · many bytes read for one output token</text></g><rect x="90" y="92" width="580" height="88" rx="10" fill="#b45309" fill-opacity=".18" stroke="#b45309"/><g fill="#b45309" fill-opacity=".7"><rect x="120" y="112" width="28" height="18" rx="3"/><rect x="156" y="112" width="28" height="18" rx="3"/><rect x="192" y="112" width="28" height="18" rx="3"/><rect x="228" y="112" width="28" height="18" rx="3"/><rect x="264" y="112" width="28" height="18" rx="3"/><rect x="300" y="112" width="28" height="18" rx="3"/><rect x="336" y="112" width="28" height="18" rx="3"/><rect x="372" y="112" width="28" height="18" rx="3"/><rect x="408" y="112" width="28" height="18" rx="3"/><rect x="444" y="112" width="28" height="18" rx="3"/><rect x="480" y="112" width="28" height="18" rx="3"/><rect x="516" y="112" width="28" height="18" rx="3"/><rect x="552" y="112" width="28" height="18" rx="3"/><rect x="588" y="112" width="28" height="18" rx="3"/></g><rect x="340" y="202" width="80" height="24" rx="5" fill="#2563eb" fill-opacity=".75"/><path d="M380 180v22" stroke="#94a3b8" stroke-width="2"/></svg>
