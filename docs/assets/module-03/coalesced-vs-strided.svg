<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">Coalesced and strided memory access</title><desc id="desc">Neighboring threads reading neighboring values are more efficient than threads reading widely separated values.</desc><rect x="8" y="8" width="744" height="314" rx="14" fill="#64748b" fill-opacity=".08" stroke="#94a3b8" stroke-opacity=".45"/><g fill="currentColor" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"><text x="380" y="38" font-size="22" font-weight="700">Access layout changes memory efficiency</text><text x="190" y="78" font-size="18" font-weight="700">Coalesced</text><text x="570" y="78" font-size="18" font-weight="700">Strided</text></g><g fill="#0d9488" fill-opacity=".75"><rect x="48" y="104" width="34" height="34" rx="5"/><rect x="88" y="104" width="34" height="34" rx="5"/><rect x="128" y="104" width="34" height="34" rx="5"/><rect x="168" y="104" width="34" height="34" rx="5"/><rect x="208" y="104" width="34" height="34" rx="5"/><rect x="248" y="104" width="34" height="34" rx="5"/></g><g fill="#b45309" fill-opacity=".75"><rect x="452" y="104" width="34" height="34" rx="5"/><rect x="532" y="104" width="34" height="34" rx="5"/><rect x="612" y="104" width="34" height="34" rx="5"/><rect x="692" y="104" width="34" height="34" rx="5"/></g><g fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13"><text x="56" y="172">thread 0 → element 0</text><text x="56" y="196">thread 1 → element 1</text><text x="56" y="220">thread 2 → element 2</text><text x="56" y="244">neighboring addresses</text><text x="456" y="172">thread 0 → element 0</text><text x="456" y="196">thread 1 → element 32</text><text x="456" y="220">thread 2 → element 64</text><text x="456" y="244">widely separated addresses</text><text x="380" y="292" text-anchor="middle" font-size="12">Same useful values; different memory transactions.</text></g></svg>
