<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">GPU memory hierarchy</title><desc id="desc">Registers, shared memory, caches, VRAM, and CPU RAM arranged by proximity and capacity.</desc><rect x="8" y="8" width="744" height="344" rx="14" fill="#64748b" fill-opacity=".08" stroke="#94a3b8" stroke-opacity=".45"/><g fill="currentColor" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"><text x="380" y="38" font-size="22" font-weight="700">Closer to computation → faster, smaller</text><text x="380" y="342" font-size="13">Farther from computation → larger, more data movement</text></g><g stroke-width="2"><rect x="220" y="56" width="320" height="42" rx="8" fill="#7c3aed" fill-opacity=".18" stroke="#7c3aed"/><rect x="180" y="108" width="400" height="42" rx="8" fill="#0d9488" fill-opacity=".16" stroke="#0d9488"/><rect x="140" y="160" width="480" height="42" rx="8" fill="#2563eb" fill-opacity=".14" stroke="#2563eb"/><rect x="100" y="212" width="560" height="42" rx="8" fill="#b45309" fill-opacity=".14" stroke="#b45309"/><rect x="60" y="264" width="640" height="42" rx="8" fill="#64748b" fill-opacity=".14" stroke="#64748b"/></g><g fill="currentColor" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"><text x="380" y="83" font-size="17" font-weight="700">Registers · per thread</text><text x="380" y="135" font-size="17" font-weight="700">Shared memory / L1 · per SM</text><text x="380" y="187" font-size="17" font-weight="700">L2 cache · GPU-wide</text><text x="380" y="239" font-size="17" font-weight="700">VRAM · GDDR6 global memory</text><text x="380" y="291" font-size="17" font-weight="700">CPU RAM · outside the GPU</text></g></svg>
