<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">PyTorch allocated and reserved GPU memory</title><desc id="desc">Live tensor allocation is part of reserved allocator memory; deleting a tensor may leave the block reserved until the cache is emptied.</desc><rect x="8" y="8" width="744" height="284" rx="14" fill="#64748b" fill-opacity=".08" stroke="#94a3b8" stroke-opacity=".45"/><g fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle"><text x="380" y="38" font-size="22" font-weight="700">Allocated memory is not the same as reserved memory</text><text x="190" y="82" font-size="17" font-weight="700">Live tensor</text><text x="570" y="82" font-size="17" font-weight="700">Caching allocator</text></g><rect x="56" y="110" width="268" height="64" rx="9" fill="#7c3aed" fill-opacity=".2" stroke="#7c3aed"/><rect x="436" y="110" width="268" height="64" rx="9" fill="#64748b" fill-opacity=".18" stroke="#94a3b8"/><rect x="464" y="128" width="112" height="28" rx="5" fill="#7c3aed" fill-opacity=".8"/><rect x="586" y="128" width="90" height="28" rx="5" fill="#94a3b8" fill-opacity=".35"/><g fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle" font-size="13"><text x="190" y="145">allocated by tensor</text><text x="570" y="145">allocated + cached free blocks</text><text x="190" y="218">after deleting x</text><text x="570" y="218">reserved can remain high</text><text x="380" y="264" font-size="12">empty_cache() releases eligible unused blocks; it cannot free live tensors.</text></g><path d="M190 176v24M570 176v24" stroke="#94a3b8" stroke-width="2"/></svg>
