<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">Paged KV cache block mapping</title><desc id="desc">Logical token blocks map to physical KV cache blocks that need not be contiguous.</desc><rect x="8" y="8" width="744" height="314" rx="14" fill="#64748b" fill-opacity=".08" stroke="#94a3b8" stroke-opacity=".45"/><g fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle"><text x="190" y="38" font-size="21" font-weight="700">Logical sequence</text><text x="570" y="38" font-size="21" font-weight="700">Physical KV blocks</text><text x="190" y="64" font-size="12">token order</text><text x="570" y="64" font-size="12">allocated where space exists</text></g><g fill="#2563eb" fill-opacity=".7"><rect x="48" y="100" width="74" height="46" rx="7"/><rect x="132" y="100" width="74" height="46" rx="7"/><rect x="216" y="100" width="74" height="46" rx="7"/><rect x="300" y="100" width="74" height="46" rx="7"/></g><g fill="#0d9488" fill-opacity=".7"><rect x="454" y="82" width="74" height="46" rx="7"/><rect x="580" y="82" width="74" height="46" rx="7"/><rect x="504" y="154" width="74" height="46" rx="7"/><rect x="646" y="224" width="74" height="46" rx="7"/></g><g stroke="#94a3b8" stroke-width="2"><path d="M122 123L454 105"/><path d="M206 123L580 105"/><path d="M290 123L504 177"/><path d="M374 123L646 247"/></g><g fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle" font-size="13"><text x="85" y="128">tokens 0–15</text><text x="169" y="128">16–31</text><text x="253" y="128">32–47</text><text x="337" y="128">48–63</text><text x="491" y="110">block 8</text><text x="617" y="110">block 2</text><text x="541" y="182">block 11</text><text x="683" y="252">block 5</text><text x="380" y="298">Logical order can remain continuous while physical allocation is paged.</text></g></svg>
