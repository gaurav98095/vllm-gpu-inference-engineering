<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-labelledby="title desc"><title id="title">Register pressure and occupancy</title><desc id="desc">Higher registers per thread consume more registers per block and can reduce the number of resident blocks.</desc><rect x="8" y="8" width="744" height="264" rx="14" fill="#64748b" fill-opacity=".08" stroke="#94a3b8" stroke-opacity=".45"/><g fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif"><text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700">Register pressure can reduce residency</text><text x="190" y="78" text-anchor="middle" font-size="17" font-weight="700">32 registers / thread</text><text x="570" y="78" text-anchor="middle" font-size="17" font-weight="700">128 registers / thread</text></g><g fill="#0d9488" fill-opacity=".7"><rect x="66" y="104" width="42" height="42" rx="5"/><rect x="116" y="104" width="42" height="42" rx="5"/><rect x="166" y="104" width="42" height="42" rx="5"/><rect x="216" y="104" width="42" height="42" rx="5"/><rect x="266" y="104" width="42" height="42" rx="5"/><rect x="516" y="104" width="42" height="42" rx="5"/><rect x="566" y="104" width="42" height="42" rx="5"/></g><g fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle" font-size="13"><text x="190" y="180">8 blocks fit from registers alone</text><text x="570" y="180">2 blocks fit from registers alone</text><text x="380" y="225" font-size="12">Illustrative: real residency also depends on threads, shared memory, and allocation granularity.</text></g></svg>
