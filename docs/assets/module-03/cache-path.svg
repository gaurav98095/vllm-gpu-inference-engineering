<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-labelledby="title desc"><title id="title">GPU cache reuse path</title><desc id="desc">A request for data may be served from L1, L2, or VRAM depending on reuse and cache state.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker></defs><rect x="8" y="8" width="744" height="264" rx="14" fill="#64748b" fill-opacity=".08" stroke="#94a3b8" stroke-opacity=".45"/><g fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle"><text x="380" y="38" font-size="22" font-weight="700">Hardware-managed cache reuse</text><text x="96" y="88" font-size="17" font-weight="700">Thread / SM</text><text x="270" y="88" font-size="17" font-weight="700">L1 cache</text><text x="454" y="88" font-size="17" font-weight="700">L2 cache</text><text x="640" y="88" font-size="17" font-weight="700">GDDR6 VRAM</text><text x="96" y="198" font-size="12">request</text><text x="270" y="198" font-size="12">nearby reuse</text><text x="454" y="198" font-size="12">cross-SM reuse</text><text x="640" y="198" font-size="12">large backing store</text></g><g stroke-width="2"><rect x="38" y="112" width="116" height="48" rx="8" fill="#7c3aed" fill-opacity=".15" stroke="#7c3aed"/><rect x="212" y="112" width="116" height="48" rx="8" fill="#0d9488" fill-opacity=".15" stroke="#0d9488"/><rect x="396" y="112" width="116" height="48" rx="8" fill="#2563eb" fill-opacity=".15" stroke="#2563eb"/><rect x="582" y="112" width="116" height="48" rx="8" fill="#b45309" fill-opacity=".15" stroke="#b45309"/></g><g stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"><path d="M154 136h54"/><path d="M328 136h54"/><path d="M512 136h54"/></g><text x="380" y="244" text-anchor="middle" fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">The exact path depends on instruction type, locality, cache policy, and current cache contents.</text></svg>
