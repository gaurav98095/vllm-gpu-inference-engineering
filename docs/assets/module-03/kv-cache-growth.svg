<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc"><title id="title">KV cache growth with context and concurrency</title><desc id="desc">KV-cache memory grows with context length and multiplies across concurrent sequences.</desc><rect x="8" y="8" width="744" height="304" rx="14" fill="#64748b" fill-opacity=".08" stroke="#94a3b8" stroke-opacity=".45"/><g fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif"><text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700">KV-cache memory grows with tokens × sequences</text><text x="54" y="82" font-size="14">Memory</text><text x="380" y="292" text-anchor="middle" font-size="13">Context tokens per sequence</text></g><line x1="78" y1="246" x2="700" y2="246" stroke="#94a3b8" stroke-width="2"/><line x1="78" y1="98" x2="78" y2="246" stroke="#94a3b8" stroke-width="2"/><g fill="#0d9488" fill-opacity=".75"><rect x="132" y="218" width="76" height="28" rx="5"/><rect x="276" y="190" width="76" height="56" rx="5"/><rect x="420" y="134" width="76" height="112" rx="5"/><rect x="564" y="102" width="76" height="144" rx="5"/></g><g fill="currentColor" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13"><text x="170" y="268">512</text><text x="314" y="268">1,024</text><text x="458" y="268">2,048</text><text x="602" y="268">4,096</text><text x="170" y="210">0.25×</text><text x="314" y="182">0.5×</text><text x="458" y="126">1×</text><text x="602" y="94">2×</text><text x="380" y="70" font-size="12">For a fixed model, doubling context roughly doubles one sequence’s KV storage.</text></g><rect x="104" y="112" width="18" height="18" rx="3" fill="#2563eb"/><text x="132" y="126" fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">one sequence</text><rect x="244" y="112" width="18" height="18" rx="3" fill="#b45309"/><text x="272" y="126" fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">more sequences multiply demand</text></svg>
