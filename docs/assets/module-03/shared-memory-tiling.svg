<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc"><title id="title">Shared-memory tiled matrix multiplication</title><desc id="desc">Tiles of matrices A and B are loaded once and reused by threads to produce an output tile.</desc><rect x="8" y="8" width="744" height="304" rx="14" fill="#64748b" fill-opacity=".08" stroke="#94a3b8" stroke-opacity=".45"/><g fill="currentColor" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"><text x="380" y="38" font-size="22" font-weight="700">Tile reuse reduces repeated VRAM reads</text><text x="120" y="76" font-size="18" font-weight="700">A tile</text><text x="380" y="76" font-size="18" font-weight="700">B tile</text><text x="640" y="76" font-size="18" font-weight="700">C tile</text></g><g stroke-width="2"><rect x="44" y="94" width="152" height="152" fill="#2563eb" fill-opacity=".12" stroke="#2563eb"/><rect x="304" y="94" width="152" height="152" fill="#0d9488" fill-opacity=".12" stroke="#0d9488"/><rect x="564" y="94" width="152" height="152" fill="#b45309" fill-opacity=".12" stroke="#b45309"/></g><g stroke="#94a3b8" stroke-width="1"><path d="M82 94v152M120 94v152M158 94v152M44 132h152M44 170h152M44 208h152M342 94v152M380 94v152M418 94v152M304 132h152M304 170h152M304 208h152M602 94v152M640 94v152M678 94v152M564 132h152M564 170h152M564 208h152"/></g><path d="M196 170h100M456 170h100" stroke="#94a3b8" stroke-width="2.5"/><g fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle" font-size="13"><text x="246" y="163">load once</text><text x="506" y="163">reuse</text><text x="380" y="282">Threads cooperate on tiles in shared memory before writing an output tile.</text></g></svg>
