<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">Memory latency and bandwidth</title><desc id="desc">Latency is time to first data; bandwidth is sustained data volume per second.</desc><rect x="8" y="8" width="744" height="284" rx="14" fill="#64748b" fill-opacity=".08" stroke="#94a3b8" stroke-opacity=".45"/><g fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif"><text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700">Latency and bandwidth are different</text><text x="195" y="82" text-anchor="middle" font-size="18" font-weight="700">Latency</text><text x="565" y="82" text-anchor="middle" font-size="18" font-weight="700">Bandwidth</text></g><line x1="58" y1="132" x2="332" y2="132" stroke="#94a3b8" stroke-width="3"/><circle cx="92" cy="132" r="11" fill="#7c3aed"/><text x="92" y="174" fill="currentColor" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">first byte</text><text x="195" y="220" fill="currentColor" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">how long until data starts arriving</text><line x1="428" y1="132" x2="704" y2="132" stroke="#94a3b8" stroke-width="3"/><g fill="#0d9488" fill-opacity=".75"><rect x="428" y="112" width="34" height="40" rx="5"/><rect x="468" y="112" width="34" height="40" rx="5"/><rect x="508" y="112" width="34" height="40" rx="5"/><rect x="548" y="112" width="34" height="40" rx="5"/><rect x="588" y="112" width="34" height="40" rx="5"/><rect x="628" y="112" width="34" height="40" rx="5"/><rect x="668" y="112" width="34" height="40" rx="5"/></g><text x="565" y="220" fill="currentColor" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">how much data arrives per second</text><text x="380" y="268" fill="currentColor" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">A system can have high bandwidth without having the lowest latency.</text></svg>
