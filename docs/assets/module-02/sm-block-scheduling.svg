<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">CUDA blocks scheduled across SMs</title><desc id="desc">Blocks are assigned to available SMs, and ready warps can be selected while another warp waits for memory.</desc><rect x="8" y="8" width="744" height="284" rx="14" fill="#64748b" fill-opacity=".08" stroke="#94a3b8" stroke-opacity=".45"/><text x="380" y="38" text-anchor="middle" fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="700">Blocks are distributed across available SMs</text><g fill="#2563eb" fill-opacity=".22" stroke="#2563eb"><rect x="38" y="72" width="92" height="48" rx="8"/><rect x="144" y="72" width="92" height="48" rx="8"/><rect x="250" y="72" width="92" height="48" rx="8"/><rect x="356" y="72" width="92" height="48" rx="8"/><rect x="462" y="72" width="92" height="48" rx="8"/><rect x="568" y="72" width="92" height="48" rx="8"/></g><g fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" text-anchor="middle"><text x="84" y="101">Block 0</text><text x="190" y="101">Block 1</text><text x="296" y="101">Block 2</text><text x="402" y="101">Block 3</text><text x="508" y="101">Block 4</text><text x="614" y="101">Block 5</text></g><path d="M84 120v36M190 120v36M296 120v36M402 120v36M508 120v36M614 120v36" stroke="#94a3b8" stroke-width="2"/><g fill="#0d9488" fill-opacity=".2" stroke="#0d9488"><rect x="38" y="156" width="92" height="48" rx="8"/><rect x="144" y="156" width="92" height="48" rx="8"/><rect x="250" y="156" width="92" height="48" rx="8"/><rect x="356" y="156" width="92" height="48" rx="8"/><rect x="462" y="156" width="92" height="48" rx="8"/><rect x="568" y="156" width="92" height="48" rx="8"/></g><g fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" text-anchor="middle"><text x="84" y="185">SM 0</text><text x="190" y="185">SM 1</text><text x="296" y="185">SM 2</text><text x="402" y="185">SM 3</text><text x="508" y="185">SM 4</text><text x="614" y="185">SM 5</text><text x="380" y="238">More blocks wait until SM resources become available.</text><text x="380" y="263">An SM may host multiple resident blocks when resources allow.</text></g></svg>
