<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-labelledby="title desc"><title id="title">CUDA cores and Tensor Cores</title><desc id="desc">CUDA cores execute general arithmetic while Tensor Cores accelerate supported matrix multiply-accumulate tiles.</desc><rect x="8" y="8" width="744" height="264" rx="14" fill="#64748b" fill-opacity=".08" stroke="#94a3b8" stroke-opacity=".45"/><rect x="28" y="28" width="330" height="224" rx="12" fill="#2563eb" fill-opacity=".08" stroke="#2563eb" stroke-opacity=".7"/><rect x="402" y="28" width="330" height="224" rx="12" fill="#0d9488" fill-opacity=".08" stroke="#0d9488" stroke-opacity=".7"/><g fill="currentColor" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"><text x="193" y="60" font-size="22" font-weight="700">CUDA cores</text><text x="193" y="83" font-size="13">general arithmetic</text><text x="567" y="60" font-size="22" font-weight="700">Tensor Cores</text><text x="567" y="83" font-size="13">matrix multiply-accumulate</text></g><g fill="#2563eb" fill-opacity=".75"><rect x="66" y="111" width="44" height="44" rx="7"/><rect x="124" y="111" width="44" height="44" rx="7"/><rect x="182" y="111" width="44" height="44" rx="7"/><rect x="240" y="111" width="44" height="44" rx="7"/></g><g fill="#0d9488" fill-opacity=".75"><rect x="460" y="107" width="32" height="32" rx="5"/><rect x="496" y="107" width="32" height="32" rx="5"/><rect x="532" y="107" width="32" height="32" rx="5"/><rect x="568" y="107" width="32" height="32" rx="5"/><rect x="460" y="143" width="32" height="32" rx="5"/><rect x="496" y="143" width="32" height="32" rx="5"/><rect x="532" y="143" width="32" height="32" rx="5"/><rect x="568" y="143" width="32" height="32" rx="5"/></g><g fill="currentColor" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13"><text x="193" y="191">FP32 / integer operations</text><text x="193" y="215">one execution lane per tile</text><text x="567" y="201">supported FP16 / INT8 tiles</text><text x="567" y="225">C = A × B + D</text></g></svg>
