<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">NVIDIA T4 hardware hierarchy</title><desc id="desc">A conceptual hierarchy from a T4 GPU to streaming multiprocessors, CUDA cores, Tensor Cores, and memory.</desc><rect x="8" y="8" width="744" height="344" rx="14" fill="#64748b" fill-opacity=".08" stroke="#94a3b8" stroke-opacity=".45"/><rect x="220" y="24" width="320" height="54" rx="10" fill="#2563eb" fill-opacity=".16" stroke="#2563eb" stroke-opacity=".7"/><text x="380" y="57" fill="currentColor" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="23" font-weight="700">NVIDIA T4 GPU</text><path d="M380 78v24M380 102H190M380 102h190M190 102v20M570 102v20" stroke="#94a3b8" stroke-width="2"/><rect x="48" y="122" width="284" height="92" rx="10" fill="#0d9488" fill-opacity=".12" stroke="#0d9488" stroke-opacity=".7"/><rect x="428" y="122" width="284" height="92" rx="10" fill="#b45309" fill-opacity=".12" stroke="#b45309" stroke-opacity=".7"/><text x="190" y="155" fill="currentColor" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="700">40 SMs</text><text x="190" y="181" fill="currentColor" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">streaming multiprocessors</text><text x="570" y="155" fill="currentColor" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="700">16 GB GDDR6</text><text x="570" y="181" fill="currentColor" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">global device memory</text><path d="M190 214v24M570 214v24M190 238H120M190 238h140M570 238h-70M570 238h140M120 238v20M330 238v20M500 238v20M710 238v20" stroke="#94a3b8" stroke-width="2"/><rect x="40" y="258" width="160" height="68" rx="9" fill="#2563eb" fill-opacity=".1" stroke="#2563eb" stroke-opacity=".65"/><rect x="230" y="258" width="160" height="68" rx="9" fill="#0d9488" fill-opacity=".1" stroke="#0d9488" stroke-opacity=".65"/><rect x="410" y="258" width="160" height="68" rx="9" fill="#0d9488" fill-opacity=".1" stroke="#0d9488" stroke-opacity=".65"/><rect x="600" y="258" width="120" height="68" rx="9" fill="#b45309" fill-opacity=".1" stroke="#b45309" stroke-opacity=".65"/><g fill="currentColor" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"><text x="120" y="287" font-size="16" font-weight="700">64</text><text x="120" y="307" font-size="12">CUDA cores / SM</text><text x="310" y="287" font-size="16" font-weight="700">8</text><text x="310" y="307" font-size="12">Tensor Cores / SM</text><text x="490" y="287" font-size="16" font-weight="700">registers</text><text x="490" y="307" font-size="12">shared memory</text><text x="660" y="287" font-size="16" font-weight="700">L2</text><text x="660" y="307" font-size="12">cache</text></g></svg>
