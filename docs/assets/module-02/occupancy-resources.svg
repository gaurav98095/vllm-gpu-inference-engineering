<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">Occupancy and per-thread resource usage</title><desc id="desc">As register or shared-memory use grows, fewer warps may remain resident on an SM.</desc><rect x="8" y="8" width="744" height="284" rx="14" fill="#64748b" fill-opacity=".08" stroke="#94a3b8" stroke-opacity=".45"/><g fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif"><text x="380" y="38" text-anchor="middle" font-size="21" font-weight="700">More per-thread resources can reduce occupancy</text><text x="86" y="82" text-anchor="middle" font-size="13">light</text><text x="260" y="82" text-anchor="middle" font-size="13">moderate</text><text x="434" y="82" text-anchor="middle" font-size="13">heavy</text><text x="608" y="82" text-anchor="middle" font-size="13">very heavy</text></g><g fill="#0d9488" fill-opacity=".7"><rect x="42" y="102" width="88" height="120" rx="7"/><rect x="216" y="132" width="88" height="90" rx="7"/><rect x="390" y="164" width="88" height="58" rx="7"/><rect x="564" y="190" width="88" height="32" rx="7"/></g><g fill="currentColor" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"><text x="86" y="246" font-size="13">many resident warps</text><text x="260" y="246" font-size="13">fewer resident warps</text><text x="434" y="246" font-size="13">resource pressure</text><text x="608" y="246" font-size="13">low occupancy</text><text x="380" y="275" font-size="12">Illustrative relationship — not a T4 occupancy measurement</text></g></svg>
