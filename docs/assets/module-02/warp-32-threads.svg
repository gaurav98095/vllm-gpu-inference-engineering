<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title desc"><title id="title">Warp of 32 CUDA threads</title><desc id="desc">Thirty-two lanes are grouped into one warp and receive the same instruction stream with different data.</desc><rect x="8" y="8" width="744" height="234" rx="14" fill="#64748b" fill-opacity=".08" stroke="#94a3b8" stroke-opacity=".45"/><text x="380" y="42" text-anchor="middle" fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="700">One warp = 32 threads</text><g fill="#b45309" fill-opacity=".75" stroke="#b45309"><rect x="80" y="72" width="44" height="34" rx="5"/><rect x="130" y="72" width="44" height="34" rx="5"/><rect x="180" y="72" width="44" height="34" rx="5"/><rect x="230" y="72" width="44" height="34" rx="5"/><rect x="280" y="72" width="44" height="34" rx="5"/><rect x="330" y="72" width="44" height="34" rx="5"/><rect x="380" y="72" width="44" height="34" rx="5"/><rect x="430" y="72" width="44" height="34" rx="5"/><rect x="480" y="72" width="44" height="34" rx="5"/><rect x="530" y="72" width="44" height="34" rx="5"/><rect x="580" y="72" width="44" height="34" rx="5"/><rect x="630" y="72" width="44" height="34" rx="5"/><rect x="80" y="116" width="44" height="34" rx="5"/><rect x="130" y="116" width="44" height="34" rx="5"/><rect x="180" y="116" width="44" height="34" rx="5"/><rect x="230" y="116" width="44" height="34" rx="5"/><rect x="280" y="116" width="44" height="34" rx="5"/><rect x="330" y="116" width="44" height="34" rx="5"/><rect x="380" y="116" width="44" height="34" rx="5"/><rect x="430" y="116" width="44" height="34" rx="5"/><rect x="480" y="116" width="44" height="34" rx="5"/><rect x="530" y="116" width="44" height="34" rx="5"/><rect x="580" y="116" width="44" height="34" rx="5"/><rect x="630" y="116" width="44" height="34" rx="5"/></g><g fill="currentColor" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11"><text x="102" y="94">0</text><text x="152" y="94">1</text><text x="202" y="94">2</text><text x="252" y="94">3</text><text x="302" y="94">4</text><text x="352" y="94">5</text><text x="402" y="94">6</text><text x="452" y="94">7</text><text x="502" y="94">8</text><text x="552" y="94">9</text><text x="602" y="94">10</text><text x="652" y="94">11</text><text x="102" y="138">16</text><text x="152" y="138">17</text><text x="202" y="138">18</text><text x="252" y="138">19</text><text x="302" y="138">20</text><text x="352" y="138">21</text><text x="402" y="138">22</text><text x="452" y="138">23</text><text x="502" y="138">24</text><text x="552" y="138">25</text><text x="602" y="138">26</text><text x="652" y="138">27</text></g><text x="380" y="190" text-anchor="middle" fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">Same instruction: C[i] = A[i] + B[i] · different lane data</text><text x="380" y="216" text-anchor="middle" fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">SIMT: Single Instruction, Multiple Threads</text></svg>
