<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="title desc"><title id="title">Vector addition thread mapping</title><desc id="desc">Each CUDA thread adds one matching pair of elements from arrays A and B.</desc><rect x="8" y="8" width="744" height="244" rx="14" fill="#64748b" fill-opacity=".08" stroke="#94a3b8" stroke-opacity=".45"/><g fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif"><text x="52" y="55" font-size="17" font-weight="700">Thread</text><text x="212" y="55" font-size="17" font-weight="700">A[i]</text><text x="382" y="55" font-size="17" font-weight="700">B[i]</text><text x="552" y="55" font-size="17" font-weight="700">C[i]</text></g><g fill="#2563eb" fill-opacity=".7"><rect x="32" y="76" width="92" height="34" rx="6"/><rect x="32" y="124" width="92" height="34" rx="6"/><rect x="32" y="172" width="92" height="34" rx="6"/></g><g fill="#0d9488" fill-opacity=".7"><rect x="168" y="76" width="88" height="34" rx="6"/><rect x="168" y="124" width="88" height="34" rx="6"/><rect x="168" y="172" width="88" height="34" rx="6"/></g><g fill="#b45309" fill-opacity=".7"><rect x="338" y="76" width="88" height="34" rx="6"/><rect x="338" y="124" width="88" height="34" rx="6"/><rect x="338" y="172" width="88" height="34" rx="6"/></g><g fill="#7c3aed" fill-opacity=".7"><rect x="508" y="76" width="88" height="34" rx="6"/><rect x="508" y="124" width="88" height="34" rx="6"/><rect x="508" y="172" width="88" height="34" rx="6"/></g><g fill="currentColor" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13"><text x="78" y="98">0</text><text x="78" y="146">1</text><text x="78" y="194">2</text><text x="212" y="98">1</text><text x="212" y="146">2</text><text x="212" y="194">3</text><text x="382" y="98">10</text><text x="382" y="146">20</text><text x="382" y="194">30</text><text x="552" y="98">11</text><text x="552" y="146">22</text><text x="552" y="194">33</text></g><text x="380" y="232" text-anchor="middle" fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">C[i] = A[i] + B[i] · one independent output per thread</text></svg>
