<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">GEMM execution hierarchy</title>
  <desc id="desc">A GEMM is decomposed from output tiles to thread blocks, warps, registers, and Tensor Core matrix multiply instructions.</desc>
  <rect width="1000" height="430" rx="24" fill="#111827"/>
  <text x="500" y="44" text-anchor="middle" fill="#e0f2fe" font-family="sans-serif" font-size="27" font-weight="700">One GEMM, several layers of parallel work</text>
  <g font-family="sans-serif" text-anchor="middle">
    <g stroke-width="2"><rect x="48" y="92" width="215" height="250" rx="16" fill="#1e3a8a" stroke="#60a5fa"/><rect x="293" y="112" width="215" height="210" rx="16" fill="#115e59" stroke="#5eead4"/><rect x="538" y="132" width="195" height="170" rx="16" fill="#4c1d95" stroke="#c4b5fd"/><rect x="763" y="152" width="190" height="130" rx="16" fill="#78350f" stroke="#fbbf24"/></g>
    <g fill="#f8fafc" font-size="21" font-weight="700"><text x="155" y="135">Grid</text><text x="400" y="155">Thread block</text><text x="635" y="175">Warp</text><text x="858" y="195">MMA</text></g>
    <g fill="#bae6fd" font-size="15"><text x="155" y="174">output tiles</text><text x="155" y="202">distributed across</text><text x="155" y="230">40 T4 SMs</text><text x="400" y="194">shared-memory</text><text x="400" y="222">cooperation</text><text x="635" y="214">register</text><text x="635" y="242">fragments</text><text x="858" y="234">D = A × B + C</text></g>
    <g fill="#2dd4bf" font-size="30" font-weight="700"><text x="274" y="220">→</text><text x="519" y="220">→</text><text x="744" y="220">→</text></g>
    <text x="500" y="380" fill="#fcd34d" font-size="17">Resource limits—registers, shared memory, threads—control residency and occupancy.</text>
  </g>
</svg>
