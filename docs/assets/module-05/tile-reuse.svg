<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">Tiled GEMM data reuse</title>
  <desc id="desc">A block loads tiles from matrices A and B into shared memory, reuses them for multiple output values, and accumulates a tile of C.</desc>
  <rect width="1000" height="390" rx="24" fill="#111827"/>
  <text x="500" y="45" text-anchor="middle" fill="#e0f2fe" font-family="sans-serif" font-size="27" font-weight="700">Tiling turns repeated loads into local reuse</text>
  <g font-family="sans-serif" text-anchor="middle">
    <g stroke-width="2"><rect x="48" y="110" width="190" height="150" fill="#2563eb" fill-opacity=".23" stroke="#60a5fa"/><rect x="305" y="110" width="190" height="150" fill="#0d9488" fill-opacity=".23" stroke="#5eead4"/><rect x="562" y="110" width="190" height="150" fill="#7c3aed" fill-opacity=".23" stroke="#c4b5fd"/><rect x="809" y="110" width="145" height="150" fill="#b45309" fill-opacity=".26" stroke="#fbbf24"/></g>
    <g fill="#f8fafc" font-size="20" font-weight="700"><text x="143" y="152">VRAM</text><text x="400" y="152">Shared memory</text><text x="657" y="152">Registers</text><text x="881" y="152">C tile</text></g>
    <g fill="#bae6fd" font-size="15"><text x="143" y="185">A and B tiles</text><text x="400" y="185">cooperate + reuse</text><text x="657" y="185">partial sums</text><text x="881" y="185">write once</text></g>
    <g fill="#2dd4bf" font-size="32" font-weight="700"><text x="270" y="190">→</text><text x="527" y="190">→</text><text x="784" y="190">→</text></g>
    <path d="M880 280 C880 345 140 345 140 280" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="9 8"/>
    <text x="500" y="330" fill="#fcd34d" font-size="17">Repeat for the next K tile; loaded values serve many output elements.</text>
  </g>
</svg>
