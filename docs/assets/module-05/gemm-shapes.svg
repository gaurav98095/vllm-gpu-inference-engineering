<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">GEMM matrix shapes</title>
  <desc id="desc">Matrix A with shape M by K multiplies matrix B with shape K by N to produce matrix C with shape M by N.</desc>
  <rect width="1000" height="360" rx="24" fill="#111827"/>
  <text x="500" y="46" text-anchor="middle" fill="#e0f2fe" font-family="sans-serif" font-size="27" font-weight="700">GEMM maps three dimensions to one output</text>
  <g font-family="sans-serif" text-anchor="middle">
    <g stroke-width="2"><rect x="60" y="95" width="190" height="170" fill="#2563eb" fill-opacity=".24" stroke="#60a5fa"/><rect x="365" y="95" width="190" height="170" fill="#0d9488" fill-opacity=".24" stroke="#5eead4"/><rect x="750" y="95" width="190" height="170" fill="#b45309" fill-opacity=".26" stroke="#fbbf24"/></g>
    <g stroke="#94a3b8" stroke-width="1" opacity=".7"><path d="M107 95v170M155 95v170M202 95v170M60 138h190M60 180h190M60 223h190"/><path d="M412 95v170M460 95v170M507 95v170M365 138h190M365 180h190M365 223h190"/><path d="M797 95v170M845 95v170M892 95v170M750 138h190M750 180h190M750 223h190"/></g>
    <g fill="#f8fafc" font-size="24" font-weight="700"><text x="155" y="145">A</text><text x="460" y="145">B</text><text x="845" y="145">C = A × B</text></g>
    <g fill="#bae6fd" font-size="20"><text x="155" y="205">M × K</text><text x="460" y="205">K × N</text><text x="845" y="205">M × N</text></g>
    <g fill="#2dd4bf" font-size="34" font-weight="700"><text x="305" y="185">×</text><text x="655" y="185">=</text></g>
    <g fill="#fcd34d" font-size="16"><text x="155" y="305">row i</text><text x="460" y="305">column j</text><text x="845" y="305">Cᵢⱼ = dot(row i, column j)</text></g>
  </g>
</svg>
