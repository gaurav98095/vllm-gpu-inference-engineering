<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">Compute-bound and memory-bound execution</title>
  <desc id="desc">A comparison showing Tensor Core-heavy matrix multiplication versus memory-heavy data movement.</desc>
  <rect width="960" height="320" rx="24" fill="#111827"/>
  <text x="50" y="52" fill="#e0f2fe" font-family="sans-serif" font-size="27" font-weight="700">GPU activity is not always arithmetic throughput</text>
  <g font-family="sans-serif"><rect x="55" y="90" width="390" height="180" rx="16" fill="#0f766e" stroke="#5eead4" stroke-width="2"/><rect x="515" y="90" width="390" height="180" rx="16" fill="#7c2d12" stroke="#fdba74" stroke-width="2"/><text x="250" y="130" fill="#f0fdfa" font-size="22" text-anchor="middle" font-weight="700">Compute-heavy GEMM</text><text x="710" y="130" fill="#fff7ed" font-size="22" text-anchor="middle" font-weight="700">Memory-heavy step</text><g fill="#99f6e4"><rect x="100" y="165" width="45" height="65"/><rect x="155" y="150" width="45" height="80"/><rect x="210" y="135" width="45" height="95"/><rect x="265" y="145" width="45" height="85"/><rect x="320" y="125" width="45" height="105"/></g><g fill="#fed7aa"><rect x="560" y="185" width="45" height="45"/><rect x="615" y="175" width="45" height="55"/><rect x="670" y="190" width="45" height="40"/><rect x="725" y="180" width="45" height="50"/><rect x="780" y="195" width="45" height="35"/></g><text x="250" y="255" fill="#ccfbf1" font-size="15" text-anchor="middle">Tensor Cores well fed by reused tiles</text><text x="710" y="255" fill="#ffedd5" font-size="15" text-anchor="middle">memory pipelines busy; arithmetic may wait</text></g>
</svg>
