<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">Data reuse for one output tile</title>
  <desc id="desc">Input and weight tiles move from VRAM through shared memory into registers and matrix arithmetic, then output is written back.</desc>
  <rect width="1000" height="330" rx="24" fill="#111827"/>
  <text x="50" y="52" fill="#e0f2fe" font-family="sans-serif" font-size="27" font-weight="700">Feed the arithmetic units with reused tiles</text>
  <g font-family="sans-serif" text-anchor="middle"><g fill="#1e293b" stroke="#38bdf8" stroke-width="2"><rect x="45" y="115" width="150" height="85" rx="14"/><rect x="255" y="115" width="170" height="85" rx="14"/><rect x="485" y="115" width="150" height="85" rx="14"/><rect x="695" y="115" width="150" height="85" rx="14"/></g><g fill="#f8fafc" font-size="19" font-weight="700"><text x="120" y="150">VRAM</text><text x="340" y="150">Shared memory</text><text x="560" y="150">Registers</text><text x="770" y="150">MMA</text></g><g fill="#bae6fd" font-size="14"><text x="120" y="177">read tiles</text><text x="340" y="177">reuse by block</text><text x="560" y="177">partial results</text><text x="770" y="177">accumulate</text></g><g fill="#2dd4bf" font-size="30"><text x="220" y="165">→</text><text x="455" y="165">→</text><text x="665" y="165">→</text></g><path d="M770 215 C770 275 120 275 120 215" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 8"/><text x="445" y="305" fill="#fcd34d" font-size="16">repeat for the next reduction tile</text></g>
</svg>
