<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">End-to-end inference lifecycle on a T4</title>
  <desc id="desc">A nine-stage flow from model loading and request preparation to kernel execution and continuation.</desc>
  <rect width="1000" height="360" rx="24" fill="#111827"/>
  <text x="50" y="50" fill="#e0f2fe" font-family="sans-serif" font-size="27" font-weight="700">One simplified request execution</text>
  <g font-family="sans-serif" font-size="14" text-anchor="middle"><g fill="#1e293b" stroke="#38bdf8" stroke-width="2"><rect x="45" y="90" width="150" height="70" rx="12"/><rect x="220" y="90" width="150" height="70" rx="12"/><rect x="395" y="90" width="150" height="70" rx="12"/><rect x="570" y="90" width="150" height="70" rx="12"/><rect x="745" y="90" width="190" height="70" rx="12"/><rect x="132" y="225" width="150" height="70" rx="12"/><rect x="307" y="225" width="150" height="70" rx="12"/><rect x="482" y="225" width="150" height="70" rx="12"/><rect x="657" y="225" width="190" height="70" rx="12"/></g><g fill="#f8fafc" font-weight="700"><text x="120" y="120">1 Load</text><text x="295" y="120">2 Initialize</text><text x="470" y="120">3 Prepare</text><text x="645" y="120">4 Launch</text><text x="840" y="120">5 Distribute</text><text x="207" y="255">6 Fetch</text><text x="382" y="255">7 Arithmetic</text><text x="557" y="255">8 Results</text><text x="752" y="255">9 Continue</text></g><g fill="#bae6fd"><text x="120" y="143">VRAM</text><text x="295" y="143">runtime</text><text x="470" y="143">CPU</text><text x="645" y="143">CUDA</text><text x="840" y="143">SMs</text><text x="207" y="278">caches</text><text x="382" y="278">MMA</text><text x="557" y="278">memory</text><text x="752" y="278">vLLM</text></g><g fill="#2dd4bf" font-size="24"><text x="205" y="130">→</text><text x="380" y="130">→</text><text x="555" y="130">→</text><text x="730" y="130">→</text><text x="900" y="195">↘</text><text x="295" y="210">←</text><text x="470" y="210">←</text><text x="645" y="210">←</text></g></g>
</svg>
