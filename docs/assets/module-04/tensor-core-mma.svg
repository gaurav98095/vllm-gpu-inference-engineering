<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual Tensor Core matrix multiply accumulate</title>
  <desc id="desc">Two operand tiles flow into a matrix multiply accumulate operation and produce an output tile.</desc>
  <rect width="960" height="290" rx="24" fill="#111827"/>
  <text x="50" y="52" fill="#e0f2fe" font-family="sans-serif" font-size="27" font-weight="700">Conceptual matrix multiply-accumulate</text>
  <g font-family="sans-serif" text-anchor="middle"><rect x="70" y="105" width="180" height="100" rx="14" fill="#0f766e" stroke="#5eead4" stroke-width="2"/><rect x="300" y="105" width="180" height="100" rx="14" fill="#0f766e" stroke="#5eead4" stroke-width="2"/><rect x="600" y="105" width="220" height="100" rx="14" fill="#7c3aed" stroke="#c4b5fd" stroke-width="2"/><text x="160" y="148" fill="#f0fdfa" font-size="25" font-weight="700">X tile</text><text x="160" y="178" fill="#ccfbf1" font-size="16">FP16 operands</text><text x="390" y="148" fill="#f0fdfa" font-size="25" font-weight="700">W tile</text><text x="390" y="178" fill="#ccfbf1" font-size="16">FP16 operands</text><text x="710" y="145" fill="#f5f3ff" font-size="23" font-weight="700">MMA</text><text x="710" y="176" fill="#ede9fe" font-size="16">FP32 accumulation</text><g fill="#2dd4bf" font-size="34"><text x="265" y="164">×</text><text x="530" y="164">→</text></g></g>
</svg>
