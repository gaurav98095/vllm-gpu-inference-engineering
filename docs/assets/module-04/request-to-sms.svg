<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">Request execution from vLLM to SMs</title>
  <desc id="desc">vLLM and the CPU launch a kernel grid, and the GPU distributes its blocks across SMs.</desc>
  <rect width="1000" height="330" rx="24" fill="#111827"/>
  <text x="50" y="52" fill="#e0f2fe" font-family="sans-serif" font-size="27" font-weight="700">Who decides where the work goes?</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="55" y="108" width="190" height="100" rx="16" fill="#0f766e" stroke="#5eead4" stroke-width="2"/><text x="150" y="150" fill="#f0fdfa" font-size="21" font-weight="700">vLLM + CPU</text><text x="150" y="178" fill="#ccfbf1" font-size="15">prepare and schedule</text>
    <rect x="330" y="108" width="190" height="100" rx="16" fill="#7c3aed" stroke="#c4b5fd" stroke-width="2"/><text x="425" y="150" fill="#f5f3ff" font-size="21" font-weight="700">CUDA runtime</text><text x="425" y="178" fill="#ede9fe" font-size="15">launch kernel grid</text>
    <rect x="605" y="78" width="330" height="160" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="770" y="110" fill="#e0f2fe" font-size="20" font-weight="700">GPU scheduler</text>
    <g fill="#0ea5e9" stroke="#bae6fd"><rect x="635" y="132" width="72" height="54" rx="8"/><rect x="720" y="132" width="72" height="54" rx="8"/><rect x="805" y="132" width="72" height="54" rx="8"/></g><g fill="#f8fafc" font-size="15"><text x="671" y="164">SM 0</text><text x="756" y="164">SM 1</text><text x="841" y="164">SM 39</text></g>
    <g fill="#2dd4bf" font-size="30"><text x="275" y="165">→</text><text x="550" y="165">→</text></g>
  </g>
</svg>
