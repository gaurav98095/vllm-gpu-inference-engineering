<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
  <title id="title">Simplified T4 SM functional view</title>
  <desc id="desc">A conceptual SM contains warp schedulers, CUDA cores, Tensor Cores, registers, and shared memory.</desc>
  <rect width="960" height="350" rx="24" fill="#111827"/>
  <text x="50" y="52" fill="#e0f2fe" font-family="sans-serif" font-size="28" font-weight="700">Inside one Streaming Multiprocessor</text>
  <rect x="45" y="80" width="870" height="225" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <g font-family="sans-serif" text-anchor="middle"><g fill="#7c3aed" stroke="#c4b5fd" stroke-width="2"><rect x="80" y="115" width="180" height="70" rx="12"/><rect x="285" y="115" width="180" height="70" rx="12"/></g><g fill="#0f766e" stroke="#5eead4" stroke-width="2"><rect x="490" y="115" width="180" height="70" rx="12"/><rect x="695" y="115" width="180" height="70" rx="12"/></g><g fill="#f5f3ff" font-size="18" font-weight="700"><text x="170" y="145">Warp schedulers</text><text x="375" y="145">64 CUDA cores</text><text x="580" y="145">8 Tensor Cores</text><text x="785" y="145">Registers</text></g><g fill="#ede9fe" font-size="14"><text x="170" y="168">select ready warps</text><text x="375" y="168">scalar arithmetic</text><text x="580" y="168">matrix arithmetic</text><text x="785" y="168">thread-local values</text></g><rect x="285" y="215" width="390" height="55" rx="12" fill="#0ea5e9" stroke="#bae6fd" stroke-width="2"/><text x="480" y="248" fill="#f0f9ff" font-size="19" font-weight="700">Shared memory / L1 · fast data reuse</text></g>
</svg>
