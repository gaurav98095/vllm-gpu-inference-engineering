<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">Batch size and weight reuse</title><desc id="desc">A single token and a larger group of token positions reuse the same model weights.</desc><rect x="8" y="8" width="744" height="284" rx="14" fill="#64748b" fill-opacity=".08" stroke="#94a3b8" stroke-opacity=".45"/><rect x="28" y="26" width="334" height="246" rx="12" fill="#2563eb" fill-opacity=".08" stroke="#2563eb" stroke-opacity=".65"/><rect x="398" y="26" width="334" height="246" rx="12" fill="#0d9488" fill-opacity=".08" stroke="#0d9488" stroke-opacity=".65"/><g fill="currentColor" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"><text x="195" y="56" font-size="22" font-weight="700">B = 1</text><text x="565" y="56" font-size="22" font-weight="700">B = 64</text><text x="195" y="79" font-size="13">one token position</text><text x="565" y="79" font-size="13">many token positions</text></g><rect x="72" y="104" width="110" height="74" rx="10" fill="#f59e0b" fill-opacity=".25" stroke="#f59e0b"/><text x="127" y="145" fill="currentColor" text-anchor="middle" font-size="16" font-family="ui-sans-serif,system-ui,sans-serif">weights W</text><rect x="225" y="124" width="72" height="34" rx="6" fill="#2563eb" fill-opacity=".7"/><text x="261" y="146" fill="currentColor" text-anchor="middle" font-size="14" font-family="ui-sans-serif,system-ui,sans-serif">token x</text><line x1="182" y1="141" x2="225" y2="141" stroke="#94a3b8" stroke-width="2"/><rect x="442" y="104" width="110" height="74" rx="10" fill="#f59e0b" fill-opacity=".25" stroke="#f59e0b"/><text x="497" y="145" fill="currentColor" text-anchor="middle" font-size="16" font-family="ui-sans-serif,system-ui,sans-serif">weights W</text><g fill="#0d9488" fill-opacity=".75"><rect x="598" y="96" width="58" height="22" rx="5"/><rect x="664" y="96" width="58" height="22" rx="5"/><rect x="598" y="126" width="58" height="22" rx="5"/><rect x="664" y="126" width="58" height="22" rx="5"/><rect x="598" y="156" width="58" height="22" rx="5"/><rect x="664" y="156" width="58" height="22" rx="5"/></g><g stroke="#94a3b8" stroke-width="1.5"><line x1="552" y1="125" x2="598" y2="107"/><line x1="552" y1="130" x2="664" y2="107"/><line x1="552" y1="140" x2="598" y2="137"/><line x1="552" y1="145" x2="664" y2="137"/><line x1="552" y1="155" x2="598" y2="167"/><line x1="552" y1="160" x2="664" y2="167"/></g><g fill="currentColor" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12"><text x="195" y="218">large weight matrix</text><text x="195" y="240">used once per step</text><text x="565" y="218">same weight matrix</text><text x="565" y="240">reused across positions</text></g></svg>
