<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc"><title id="title">CPU RAM and GPU VRAM data movement</title><desc id="desc">Inputs move from CPU memory to GPU memory, the GPU computes, and the result may move back to the CPU.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker></defs><rect x="8" y="8" width="744" height="304" rx="14" fill="#64748b" fill-opacity=".08" stroke="#94a3b8" stroke-opacity=".45"/><rect x="32" y="86" width="192" height="150" rx="12" fill="#2563eb" fill-opacity=".1" stroke="#2563eb" stroke-opacity=".7"/><rect x="536" y="86" width="192" height="150" rx="12" fill="#0d9488" fill-opacity=".1" stroke="#0d9488" stroke-opacity=".7"/><rect x="280" y="112" width="200" height="98" rx="12" fill="#b45309" fill-opacity=".1" stroke="#b45309" stroke-opacity=".7"/><g fill="currentColor" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"><text x="128" y="123" font-size="22" font-weight="700">CPU memory</text><text x="128" y="148" font-size="14">host RAM</text><text x="128" y="181" font-size="13">A and B start here</text><text x="128" y="204" font-size="12">transfer cost</text><text x="632" y="123" font-size="22" font-weight="700">GPU memory</text><text x="632" y="148" font-size="14">device VRAM</text><text x="632" y="181" font-size="13">A, B, and C live here</text><text x="632" y="204" font-size="12">weights usually stay here</text><text x="380" y="145" font-size="19" font-weight="700">GPU compute</text><text x="380" y="170" font-size="13">C = A @ B</text><text x="380" y="193" font-size="12">keep data resident</text><text x="380" y="42" font-size="13">copy inputs →</text><text x="380" y="282" font-size="13">← optional result copy</text></g><line x1="224" y1="136" x2="280" y2="136" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="480" y1="185" x2="536" y2="185" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="536" y1="260" x2="224" y2="260" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/></svg>
