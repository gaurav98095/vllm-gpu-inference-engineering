<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="title desc"><title id="title">Latency versus throughput</title><desc id="desc">A short single-request timeline compared with a larger batch completing more total tasks.</desc><rect x="8" y="8" width="744" height="244" rx="14" fill="#64748b" fill-opacity=".08" stroke="#94a3b8" stroke-opacity=".45"/><g fill="currentColor" font-family="ui-sans-serif,system-ui,sans-serif"><text x="42" y="48" font-size="21" font-weight="700">Latency</text><text x="42" y="71" font-size="13">one request completes quickly</text><text x="408" y="48" font-size="21" font-weight="700">Throughput</text><text x="408" y="71" font-size="13">many requests complete together</text></g><line x1="42" y1="112" x2="342" y2="112" stroke="#94a3b8" stroke-width="2"/><rect x="42" y="98" width="84" height="28" rx="6" fill="#2563eb" fill-opacity=".75"/><text x="42" y="153" fill="currentColor" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">1 task · 2 ms</text><text x="42" y="178" fill="currentColor" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">lower individual latency</text><line x1="408" y1="112" x2="708" y2="112" stroke="#94a3b8" stroke-width="2"/><g fill="#0d9488" fill-opacity=".75"><rect x="408" y="88" width="156" height="18" rx="5"/><rect x="408" y="110" width="156" height="18" rx="5"/><rect x="408" y="132" width="156" height="18" rx="5"/></g><text x="408" y="180" fill="currentColor" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">100 tasks · 10 ms</text><text x="408" y="205" fill="currentColor" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">higher total throughput</text><text x="380" y="237" fill="currentColor" text-anchor="middle" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">Illustrative numbers — not hardware benchmark results</text></svg>
