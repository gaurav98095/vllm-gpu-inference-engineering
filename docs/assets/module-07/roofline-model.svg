<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Simplified NVIDIA T4 roofline model</title>
  <desc id="desc">A roofline plot with a sloped memory-bandwidth ceiling, a horizontal compute ceiling, and balance points for FP32 and FP16 Tensor Core arithmetic.</desc>
  <rect width="1000" height="560" rx="24" fill="#111827"/>
  <g font-family="ui-sans-serif,system-ui,sans-serif" fill="#f8fafc">
    <text x="500" y="42" text-anchor="middle" font-size="25" font-weight="700">T4 roofline: two ceilings limit performance</text>
    <text x="55" y="285" transform="rotate(-90 55 285)" text-anchor="middle" font-size="16">Performance (TFLOPS)</text>
    <text x="530" y="520" text-anchor="middle" font-size="16">Arithmetic intensity (FLOPs / byte)</text>
    <text x="112" y="470" font-size="13" fill="#cbd5e1">low reuse</text>
    <text x="850" y="470" font-size="13" fill="#cbd5e1">high reuse</text>
    <text x="210" y="175" font-size="18" font-weight="700" fill="#5eead4">memory-bound</text>
    <text x="700" y="112" font-size="18" font-weight="700" fill="#c4b5fd">compute-bound</text>
    <text x="595" y="92" font-size="14" fill="#ddd6fe">FP16 Tensor Core ceiling · 65 TFLOPS</text>
    <text x="595" y="126" font-size="14" fill="#bfdbfe">FP32 ceiling · 8.1 TFLOPS</text>
    <text x="430" y="382" font-size="13" fill="#99f6e4" transform="rotate(-33 430 382)">bandwidth ceiling · 320 GB/s</text>
    <text x="285" y="490" font-size="13" fill="#bae6fd">FP32 balance ≈ 25 FLOPs/byte</text>
    <text x="690" y="490" font-size="13" fill="#ddd6fe">FP16 balance ≈ 203 FLOPs/byte</text>
  </g>
  <g stroke="#64748b" stroke-width="2">
    <line x1="105" y1="450" x2="920" y2="450"/>
    <line x1="105" y1="450" x2="105" y2="78"/>
    <line x1="105" y1="380" x2="920" y2="380" opacity=".35"/>
    <line x1="105" y1="300" x2="920" y2="300" opacity=".35"/>
    <line x1="105" y1="220" x2="920" y2="220" opacity=".35"/>
    <line x1="105" y1="140" x2="920" y2="140" opacity=".35"/>
  </g>
  <path d="M105 450 L555 96 L920 96" fill="none" stroke="#2dd4bf" stroke-width="5"/>
  <path d="M105 450 L250 335 L420 200 L555 96" fill="none" stroke="#5eead4" stroke-width="3" stroke-dasharray="9 8"/>
  <line x1="250" y1="450" x2="250" y2="335" stroke="#93c5fd" stroke-width="2" stroke-dasharray="5 6"/>
  <line x1="555" y1="450" x2="555" y2="96" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="5 6"/>
  <circle cx="250" cy="335" r="8" fill="#93c5fd"/>
  <circle cx="555" cy="96" r="8" fill="#c4b5fd"/>
  <g fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">
    <text x="98" y="470" text-anchor="end">0</text>
    <text x="98" y="384" text-anchor="end">20</text>
    <text x="98" y="304" text-anchor="end">40</text>
    <text x="98" y="224" text-anchor="end">60</text>
    <text x="105" y="468">0</text>
    <text x="250" y="468" text-anchor="middle">25</text>
    <text x="555" y="468" text-anchor="middle">203</text>
    <text x="920" y="468" text-anchor="end">high</text>
  </g>
</svg>
