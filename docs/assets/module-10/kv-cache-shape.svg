<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Qwen KV-cache tensor shapes and memory</title>
  <desc id="desc">A diagram showing per-layer key and value cache shapes for Qwen2.5-0.5B and the bytes-per-token calculation.</desc>
  <rect width="1100" height="500" rx="24" fill="#111827"/>
  <g font-family="ui-sans-serif,system-ui,sans-serif" fill="#f8fafc">
    <text x="550" y="42" text-anchor="middle" font-size="26" font-weight="700">KV cache: attention history stored per layer</text>
    <text x="550" y="70" text-anchor="middle" font-size="14" fill="#cbd5e1">Qwen2.5-0.5B · 24 layers · 2 KV heads · head dimension 64 · FP16</text>
  </g>
  <g font-family="ui-sans-serif,system-ui,sans-serif">
    <rect x="55" y="115" width="290" height="245" rx="18" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="200" y="150" text-anchor="middle" fill="#bfdbfe" font-size="21" font-weight="700">One layer</text>
    <text x="200" y="185" text-anchor="middle" fill="#dbeafe" font-size="17">K and V tensors</text>
    <text x="200" y="230" text-anchor="middle" fill="#93c5fd" font-size="19">[1, 2, S_cached, 64]</text>
    <text x="200" y="270" text-anchor="middle" fill="#dbeafe" font-size="14">batch · KV heads · positions · head dim</text>
    <text x="200" y="318" text-anchor="middle" fill="#bfdbfe" font-size="14">Two tensors per layer</text>
    <path d="M365 237 H445" fill="none" stroke="#a7f3d0" stroke-width="4"/><path d="M430 225 l16 12 -16 12" fill="none" stroke="#a7f3d0" stroke-width="4"/>
    <rect x="455" y="115" width="290" height="245" rx="18" fill="#14532d" stroke="#86efac" stroke-width="2"/>
    <text x="600" y="150" text-anchor="middle" fill="#bbf7d0" font-size="21" font-weight="700">All layers</text>
    <text x="600" y="190" text-anchor="middle" fill="#dcfce7" font-size="17">24 K/V pairs</text>
    <text x="600" y="238" text-anchor="middle" fill="#86efac" font-size="19">2 × 24 × 2 × 64</text>
    <text x="600" y="275" text-anchor="middle" fill="#dcfce7" font-size="14">elements per cached position</text>
    <text x="600" y="321" text-anchor="middle" fill="#bbf7d0" font-size="15">× 2 bytes per FP16 element</text>
    <path d="M765 237 H845" fill="none" stroke="#fbbf24" stroke-width="4"/><path d="M830 225 l16 12 -16 12" fill="none" stroke="#fbbf24" stroke-width="4"/>
    <rect x="855" y="115" width="190" height="245" rx="18" fill="#451a03" stroke="#fbbf24" stroke-width="2"/>
    <text x="950" y="150" text-anchor="middle" fill="#fde68a" font-size="21" font-weight="700">Memory</text>
    <text x="950" y="205" text-anchor="middle" fill="#fef3c7" font-size="17">12,288 bytes</text>
    <text x="950" y="238" text-anchor="middle" fill="#fef3c7" font-size="15">per token</text>
    <text x="950" y="285" text-anchor="middle" fill="#fde68a" font-size="15">≈ 12 KiB</text>
    <text x="950" y="325" text-anchor="middle" fill="#fef3c7" font-size="13">logical tensor storage</text>
  </g>
  <text x="550" y="420" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17">Longer context and more active sequences grow the cache; paged serving manages where those blocks live.</text>
  <text x="550" y="452" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">Allocator reservations and temporary attention memory are additional overhead.</text>
</svg>
