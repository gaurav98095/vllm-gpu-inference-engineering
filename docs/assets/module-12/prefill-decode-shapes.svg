<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 430" role="img" aria-labelledby="title desc">
  <title id="title">Prefill versus decode matrix shapes</title>
  <desc id="desc">A comparison of a 128-row prefill projection and a one-row decode projection using the same weight matrix.</desc>
  <rect width="1050" height="430" rx="24" fill="#111827"/>
  <text x="525" y="42" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="700">Same weights, different token dimension</text>
  <text x="525" y="70" text-anchor="middle" fill="#cbd5e1" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">W is 4096 × 4096 in both cases</text>
  <rect x="45" y="110" width="455" height="260" rx="20" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
  <rect x="550" y="110" width="455" height="260" rx="20" fill="#3f1d35" stroke="#fb7185" stroke-width="2"/>
  <g font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle"><text x="272" y="150" fill="#bfdbfe" font-size="21" font-weight="700">Prefill</text><text x="777" y="150" fill="#fecdd3" font-size="21" font-weight="700">Single-request decode</text></g>
  <g font-family="ui-sans-serif,system-ui,sans-serif"><rect x="90" y="190" width="130" height="100" rx="10" fill="#2563eb" stroke="#93c5fd"/><rect x="280" y="190" width="130" height="100" rx="10" fill="#1d4ed8" stroke="#93c5fd"/><text x="155" y="245" text-anchor="middle" fill="#dbeafe" font-size="17">X</text><text x="155" y="270" text-anchor="middle" fill="#dbeafe" font-size="13">128 × 4096</text><text x="345" y="245" text-anchor="middle" fill="#dbeafe" font-size="17">W</text><text x="345" y="270" text-anchor="middle" fill="#dbeafe" font-size="13">4096 × 4096</text><path d="M225 240 H275" stroke="#cbd5e1" stroke-width="3"/><text x="250" y="225" text-anchor="middle" fill="#cbd5e1" font-size="13">×</text><text x="272" y="330" text-anchor="middle" fill="#bfdbfe" font-size="14">128 rows reuse each weight tile</text></g>
  <g font-family="ui-sans-serif,system-ui,sans-serif"><rect x="595" y="190" width="130" height="100" rx="10" fill="#e11d48" stroke="#fecdd3"/><rect x="785" y="190" width="130" height="100" rx="10" fill="#9f1239" stroke="#fecdd3"/><text x="660" y="245" text-anchor="middle" fill="#ffe4e6" font-size="17">X</text><text x="660" y="270" text-anchor="middle" fill="#ffe4e6" font-size="13">1 × 4096</text><text x="850" y="245" text-anchor="middle" fill="#ffe4e6" font-size="17">W</text><text x="850" y="270" text-anchor="middle" fill="#ffe4e6" font-size="13">4096 × 4096</text><path d="M730 240 H780" stroke="#cbd5e1" stroke-width="3"/><text x="755" y="225" text-anchor="middle" fill="#cbd5e1" font-size="13">×</text><text x="777" y="330" text-anchor="middle" fill="#fecdd3" font-size="14">one row gives less reuse per step</text></g>
</svg>
