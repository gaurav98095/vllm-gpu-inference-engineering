<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">KV cache flow during one-token decoding</title>
  <desc id="desc">A new query attends to cached keys and values, then the new key and value are appended to the cache.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#334155"/></marker></defs>
  <rect width="900" height="300" fill="#f8fafc"/>
  <text x="40" y="38" font-family="sans-serif" font-size="22" font-weight="700" fill="#0f172a">One-token decode with a KV cache</text>
  <rect x="40" y="85" width="190" height="130" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="135" y="122" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">New token</text>
  <text x="135" y="155" text-anchor="middle" font-family="monospace" font-size="16" fill="#1e3a8a">qₜ, kₜ, vₜ</text>
  <text x="135" y="185" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1e3a8a">one input position</text>
  <rect x="300" y="70" width="265" height="160" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="432" y="108" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#166534">Attention</text>
  <text x="432" y="142" text-anchor="middle" font-family="monospace" font-size="15" fill="#166534">qₜ · [K₁ … Kₜ]ᵀ</text>
  <text x="432" y="174" text-anchor="middle" font-family="monospace" font-size="15" fill="#166534">softmax(scores) · [V₁ … Vₜ]</text>
  <text x="432" y="207" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#166534">reuse old K/V; compute new q</text>
  <rect x="635" y="85" width="220" height="130" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="745" y="122" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#92400e">Updated cache</text>
  <text x="745" y="156" text-anchor="middle" font-family="monospace" font-size="16" fill="#92400e">K₁ … Kₜ₊₁</text>
  <text x="745" y="184" text-anchor="middle" font-family="monospace" font-size="16" fill="#92400e">V₁ … Vₜ₊₁</text>
  <path d="M230 150 H295" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M565 150 H630" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
