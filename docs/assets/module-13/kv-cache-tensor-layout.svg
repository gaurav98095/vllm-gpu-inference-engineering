<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">KV cache tensor layout</title>
  <desc id="desc">The cache is organized by batch, KV heads, sequence positions, and head dimension, with separate K and V tensors per layer.</desc>
  <rect width="900" height="330" fill="#ffffff"/>
  <text x="40" y="40" font-family="sans-serif" font-size="23" font-weight="700" fill="#0f172a">Per-layer cache layout</text>
  <text x="40" y="76" font-family="monospace" font-size="21" fill="#334155">K, V ∈ [B, Hₖᵥ, S_cached, dₕ]</text>
  <g font-family="sans-serif" font-size="16">
    <rect x="70" y="125" width="150" height="105" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="145" y="165" text-anchor="middle" fill="#1e3a8a" font-weight="700">Batch B</text><text x="145" y="195" text-anchor="middle" fill="#1e3a8a">requests</text>
    <rect x="245" y="125" width="150" height="105" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="320" y="165" text-anchor="middle" fill="#166534" font-weight="700">KV heads</text><text x="320" y="195" text-anchor="middle" fill="#166534">Hₖᵥ = 2</text>
    <rect x="420" y="125" width="180" height="105" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="510" y="165" text-anchor="middle" fill="#92400e" font-weight="700">Cached positions</text><text x="510" y="195" text-anchor="middle" fill="#92400e">S = prompt + output</text>
    <rect x="625" y="125" width="150" height="105" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="700" y="165" text-anchor="middle" fill="#9d174d" font-weight="700">Head dim</text><text x="700" y="195" text-anchor="middle" fill="#9d174d">dₕ = 64</text>
  </g>
  <text x="450" y="285" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#475569">Each Transformer layer owns a separate K tensor and V tensor.</text>
</svg>
