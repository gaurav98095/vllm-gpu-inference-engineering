<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">Paged KV cache block mapping</title>
  <desc id="desc">Logical sequence blocks map through a block table to non-contiguous physical GPU blocks.</desc>
  <rect width="900" height="340" fill="#ffffff"/>
  <text x="45" y="42" font-family="sans-serif" font-size="23" font-weight="700" fill="#0f172a">Paged KV cache: logical to physical blocks</text>
  <text x="55" y="90" font-family="sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">Logical sequence</text>
  <g font-family="monospace" font-size="17"><rect x="55" y="115" width="125" height="55" fill="#dbeafe" stroke="#2563eb"/><rect x="180" y="115" width="125" height="55" fill="#dbeafe" stroke="#2563eb"/><rect x="305" y="115" width="125" height="55" fill="#dbeafe" stroke="#2563eb"/><text x="117" y="149" text-anchor="middle">tokens 0–15</text><text x="242" y="149" text-anchor="middle">16–31</text><text x="367" y="149" text-anchor="middle">32–47</text></g>
  <text x="490" y="145" font-family="sans-serif" font-size="20" fill="#334155">block table</text>
  <path d="M430 142 H475" stroke="#334155" stroke-width="3"/>
  <text x="55" y="225" font-family="sans-serif" font-size="18" font-weight="700" fill="#166534">Physical GPU blocks</text>
  <g font-family="monospace" font-size="17"><rect x="55" y="250" width="125" height="55" fill="#dcfce7" stroke="#16a34a"/><rect x="300" y="250" width="125" height="55" fill="#dcfce7" stroke="#16a34a"/><rect x="600" y="250" width="125" height="55" fill="#dcfce7" stroke="#16a34a"/><text x="117" y="284" text-anchor="middle">block 7</text><text x="362" y="284" text-anchor="middle">block 2</text><text x="662" y="284" text-anchor="middle">block 11</text></g>
  <path d="M117 170 V245 M242 170 C242 205 362 205 362 245 M367 170 C367 200 662 200 662 245" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="780" y="145" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#475569">non-contiguous</text><text x="780" y="165" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#475569">physical storage</text>
</svg>
