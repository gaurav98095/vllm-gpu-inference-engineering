name: Validate course

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Build site
        run: mdbook build

      - name: Compile Python and notebook code
        run: |
          # Compile only Python source files. Notebook files are JSON documents,
          # not Python modules, so they are validated in the next step.
          python -m compileall -q code
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("code").glob("module-*/*.ipynb")):
              notebook = json.loads(path.read_text())
              for index, cell in enumerate(notebook.get("cells", [])):
                  if cell.get("cell_type") != "code":
                      continue
                  lines = []
                  for line in "".join(cell.get("source", [])).splitlines():
                      # Ignore notebook-only shell and magic commands while
                      # still parsing every Python statement in the cell.
                      if line.lstrip().startswith(("%", "!")):
                          continue
                      lines.append(line)
                  compile(
                      "\n".join(lines),
                      f"{path}:cell-{index}",
                      "exec",
                  )
          PY
